<!-- Polycam: appended to ttyd's index.html, adds on-screen keys for phones -->
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
  body {
    --keyboard-height: 4em;
  }
  #terminal-container {
      height: calc(100% - var(--keyboard-height)) !important;
  }
  #keys {
      position: fixed;
      left: 0;
      right: 0;
      bottom: 0;
      height: var(--keyboard-height);
      display: flex;
      background: #2B2B2B; /* same color as .xterm-viewport */
      padding: 0 0.5rem;
  }
  #keys button {
      flex: 1;
      font-size: 1.5em;
      margin: 0.5rem 0.5rem 0.75rem 0.5rem;
      border-radius: 0.5rem;
      border: none;
      background: #D2D2D2 /* same as text color */;
      filter: drop-shadow(5px 5px 0px #000);
  }
</style>
<div id="keys">
  <button data-key="D">◀</button>
  <button data-key="A">▲</button>
  <button data-key="B">▼</button>
  <button data-key="C">▶</button>
  <button data-key=" ">␣</button>
  <button data-key="r">↻</button>
</div>
<script>
  // arrows are ESC O x in ncurses' keypad mode, ESC [ x otherwise
  document.querySelectorAll('#keys button').forEach(button => button.addEventListener('pointerdown', event => {
    event.preventDefault();
    const key = button.dataset.key;
    const prefix = term.modes.applicationCursorKeysMode ? '\x1bO' : '\x1b[';
    term.input('ABCD'.includes(key) ? prefix + key : key);
  }));
</script>
